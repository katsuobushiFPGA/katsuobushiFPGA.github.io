<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Gym — 他人のレビューを読んで強くなる</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
  --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --green:#3fb950;
  --red:#f85149; --yellow:#e3b341; --purple:#bc8cff; --orange:#f0883e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;font-size:14px;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{cursor:pointer;font-family:inherit}
header{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;white-space:nowrap}
header h1 .sub{color:var(--dim);font-size:11px;font-weight:normal;margin-left:8px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:3px 12px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip b{color:var(--yellow)}
.ring{width:34px;height:34px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.layout{display:flex;min-height:calc(100vh - 56px)}
aside{width:300px;flex-shrink:0;border-right:1px solid var(--border);padding:14px;overflow-y:auto}
main{flex:1;padding:16px 20px;min-width:0;max-width:1100px}
.sect{margin-bottom:18px}
.sect h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:8px}
.repo{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.repo:hover{background:var(--panel2)}
.repo.active{background:var(--panel2);border-color:var(--accent)}
.repo .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tag{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--dim);white-space:nowrap}
.tag.ja{color:var(--orange);border-color:var(--orange)}
.tag.lang{color:var(--purple);border-color:#4a3a66}
input[type=text],input[type=password],input[type=number],select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 9px;font-size:13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 13px;font-size:13px}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn.green{background:#238636;border-color:#2ea043;color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--dim);font-size:12px}
.prcard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--panel);cursor:pointer;transition:border-color .15s}
.prcard:hover{border-color:var(--accent)}
.prcard .title{font-weight:600;font-size:14px;margin-bottom:4px}
.prcard .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--dim);align-items:center}
.badge-cnt{color:var(--accent);font-weight:600}
.read-mark{color:var(--green);font-weight:600;font-size:12px}
.lbl{font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid}
.state-merged{color:var(--purple)}
.state-closed{color:var(--red)}
/* detail */
.dtitle{font-size:19px;font-weight:700;margin-bottom:4px}
.dmeta{color:var(--dim);font-size:13px;margin-bottom:14px}
.card{border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-bottom:14px;overflow:hidden}
.card .head{padding:8px 13px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .body{padding:12px 14px}
.filehead{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--accent)}
pre.hunk{background:#0a0d12;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.5;overflow-x:auto;padding:8px 0;border-bottom:1px solid var(--border)}
pre.hunk .ln{display:block;padding:0 12px;white-space:pre}
pre.hunk .add{background:rgba(63,185,80,.13);color:#7ee787}
pre.hunk .del{background:rgba(248,81,73,.13);color:#ffa198}
pre.hunk .hd{color:var(--accent)}
.comment{padding:10px 14px;border-bottom:1px solid var(--border)}
.comment:last-child{border-bottom:none}
.comment .who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.comment .who img{width:22px;height:22px;border-radius:50%}
.comment .who .login{font-weight:600;color:var(--text)}
.comment .who .assoc{font-size:10px;border:1px solid var(--border);border-radius:999px;padding:0 6px;color:var(--dim)}
.md{font-size:13px;overflow-wrap:break-word}
.md p{margin:6px 0}
.md pre{background:#0a0d12;padding:9px 11px;border-radius:6px;overflow-x:auto;font-size:12px;margin:6px 0}
.md code{font-family:ui-monospace,Consolas,monospace;background:#282f3a;padding:1px 5px;border-radius:4px;font-size:12px}
.md pre code{background:none;padding:0}
.md ul,.md ol{padding-left:22px;margin:6px 0}
.md blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--dim);margin:6px 0}
.md img{max-width:100%}
.md h1,.md h2,.md h3{font-size:14px;margin:10px 0 4px}
.md table{border-collapse:collapse;margin:6px 0}
.md td,.md th{border:1px solid var(--border);padding:3px 8px;font-size:12px}
.rv-state{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.rv-APPROVED{color:var(--green);border:1px solid var(--green)}
.rv-CHANGES_REQUESTED{color:var(--red);border:1px solid var(--red)}
.rv-COMMENTED{color:var(--dim);border:1px solid var(--border)}
.rv-DISMISSED{color:var(--yellow);border:1px solid var(--yellow)}
.backbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
/* progress modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;max-width:640px;width:100%;padding:22px}
.modal h2{font-size:17px;margin-bottom:14px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--yellow)}
.stat .k{font-size:11px;color:var(--dim)}
.xpbar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--border);margin:6px 0 4px}
.xpbar>div{height:100%;background:linear-gradient(90deg,#1f6feb,#bc8cff);border-radius:999px;transition:width .4s}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{border:1px solid var(--border);border-radius:10px;padding:9px;display:flex;gap:9px;align-items:center;background:var(--panel2)}
.bdg.locked{opacity:.35;filter:grayscale(1)}
.bdg .ic{font-size:22px}
.bdg .nm{font-size:12px;font-weight:600}
.bdg .ds{font-size:10px;color:var(--dim)}
.week{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:8px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.week .bar{width:100%;background:#1f6feb;border-radius:3px 3px 0 0;min-height:2px}
.week .bar.goal{background:var(--green)}
.week .dl{font-size:9px;color:var(--dim)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--yellow);border-radius:12px;padding:14px 22px;z-index:200;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.confetti{position:fixed;z-index:300;pointer-events:none;font-size:22px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{border:1px solid var(--yellow);background:rgba(227,179,65,.08);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:12px}
details.settings summary{cursor:pointer;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
@media(max-width:860px){.layout{flex-direction:column}aside{width:100%;border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <h1>🏋️ Review Gym<span class="sub">他人が受けたレビューを全て読む</span></h1>
  <div class="chips">
    <div class="chip" id="chipLevel" title="クリックで進捗詳細">Lv.1 みならい</div>
    <div class="chip">XP <b id="chipXp">0</b></div>
    <div class="chip">🔥 <b id="chipStreak">0</b>日連続</div>
    <div class="chip" style="padding:2px 8px 2px 4px">
      <div class="ring" id="ringWrap">
        <svg width="34" height="34"><circle cx="17" cy="17" r="14" fill="none" stroke="#30363d" stroke-width="4"/><circle id="ringFg" cx="17" cy="17" r="14" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="88"/></svg>
        <div class="num" id="ringNum">0</div>
      </div>
      <span class="muted">今日 <span id="todayCnt">0</span>/<span id="goalShow">15</span></span>
    </div>
    <button class="btn" id="btnProgress">📊 進捗</button>
  </div>
</header>

<div class="layout">
<aside>
  <div class="sect">
    <h3>リポジトリ</h3>
    <div id="repoList"></div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="addRepoInput" placeholder="owner/repo を追加">
      <button class="btn" id="addRepoBtn">追加</button>
    </div>
  </div>
  <div class="sect">
    <details class="settings" open>
      <summary>⚙️ 設定</summary>
      <label class="muted">GitHub Personal Access Token</label>
      <input type="password" id="patInput" placeholder="ghp_... / github_pat_...">
      <div class="muted" style="margin:4px 0 10px">public_repo の read 権限だけでOK。ブラウザ内(localStorage)にのみ保存されます。</div>
      <label class="muted">1日のノルマ (10〜20推奨)</label>
      <input type="number" id="goalInput" min="1" max="50" value="15">
      <label class="row" style="margin-top:10px;font-size:12px;color:var(--dim)">
        <input type="checkbox" id="autoEnrich" style="width:auto"> レビュー数を自動取得(PR毎に+1リクエスト)
      </label>
      <div class="muted" style="margin-top:10px">API残量: <span id="rateShow">-</span></div>
    </details>
  </div>
</aside>

<main id="main"></main>
</div>

<script>
"use strict";
/* ============ state ============ */
const DEFAULT_REPOS = [
  {full:"misskey-dev/misskey",    langs:["TypeScript","Vue"],    ja:true,  note:"SNS。日本語レビュー多数"},
  {full:"EC-CUBE/ec-cube",        langs:["PHP","Symfony"],       ja:true,  note:"EC。日本語の丁寧なレビュー文化"},
  {full:"VOICEVOX/voicevox",      langs:["TypeScript","Electron"],ja:true, note:"音声合成。日本語レビュー"},
  {full:"laravel/framework",      langs:["PHP","Laravel"],       ja:false, note:"Laravel本体"},
  {full:"symfony/symfony",        langs:["PHP"],                 ja:false, note:"レビュー文化が丁寧"},
  {full:"vercel/next.js",         langs:["TypeScript","Next.js"],ja:false, note:"レビュー超活発"},
  {full:"facebook/react",         langs:["JavaScript","React"],  ja:false, note:"React本体"},
  {full:"microsoft/TypeScript",   langs:["TypeScript"],          ja:false, note:"コンパイラ"},
  {full:"microsoft/vscode",       langs:["TypeScript"],          ja:false, note:"大規模TS"},
  {full:"nodejs/node",            langs:["JavaScript","C++"],    ja:false, note:"レビュー必須文化"},
  {full:"spring-projects/spring-boot",langs:["Java"],            ja:false, note:"Java定番"},
  {full:"elastic/elasticsearch",  langs:["Java"],                ja:false, note:"詳細なレビュー"},
  {full:"apache/kafka",           langs:["Java"],                ja:false, note:"Apache流レビュー"},
  {full:"excalidraw/excalidraw",  langs:["TypeScript","React"],  ja:false, note:"読みやすい規模感"}
];
const LEVELS = [
  {xp:0,   name:"みならい"},        {xp:100, name:"かけだし"},
  {xp:250, name:"レビューウォッチャー"},{xp:450, name:"指摘ハンター"},
  {xp:700, name:"差分ソムリエ"},     {xp:1000,name:"観点コレクター"},
  {xp:1400,name:"レビュー職人"},     {xp:1900,name:"レビュー鬼"},
  {xp:2500,name:"レビュー賢者"},     {xp:3200,name:"レビュー仙人"}
];
const BADGES = [
  {id:"first",   ic:"🌱", nm:"はじめの一歩",  ds:"初めてレビューを読了"},
  {id:"goal1",   ic:"🎯", nm:"ノルマ達成",    ds:"1日のノルマを初達成"},
  {id:"streak3", ic:"🔥", nm:"三日坊主克服",  ds:"3日連続で読了"},
  {id:"streak7", ic:"⚡", nm:"週間ランナー",  ds:"7日連続で読了"},
  {id:"streak30",ic:"👑", nm:"習慣の王",      ds:"30日連続で読了"},
  {id:"total10", ic:"📖", nm:"読者",          ds:"累計10件読了"},
  {id:"total50", ic:"📚", nm:"多読家",        ds:"累計50件読了"},
  {id:"total100",ic:"🏆", nm:"百戦錬磨",      ds:"累計100件読了"},
  {id:"total300",ic:"🐉", nm:"レビュードラゴン",ds:"累計300件読了"},
  {id:"burst20", ic:"💥", nm:"爆読",          ds:"1日で20件読了"},
  {id:"repos3",  ic:"🗺️", nm:"越境者",        ds:"3つのリポジトリで読了"},
  {id:"bilingual",ic:"🌏",nm:"バイリンガル",  ds:"日本語系と英語系の両方で読了"}
];
const XP_READ=10, XP_GOAL=30, XP_BADGE=20;

let S = load();
function load(){
  let s;
  try{ s = JSON.parse(localStorage.getItem("crgym")||"{}"); }catch(e){ s={}; }
  s.pat ??= ""; s.goal ??= 15; s.xp ??= 0;
  s.repos ??= DEFAULT_REPOS.map(r=>({...r}));
  s.read ??= {};        // "owner/repo#123" -> {d:"2026-07-18", repo, title}
  s.daily ??= {};       // "2026-07-18" -> count
  s.badges ??= {};      // id -> dateISO
  s.goalDays ??= {};    // date -> true (goal bonus granted)
  s.autoEnrich ??= null;
  return s;
}
function save(){ localStorage.setItem("crgym", JSON.stringify(S)); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ============ github api ============ */
const memCache = new Map();
let rateInfo = "-";
async function gh(path, ttlMin=20){
  const url = path.startsWith("http") ? path : "https://api.github.com"+path;
  const c = memCache.get(url);
  if(c && Date.now()-c.t < ttlMin*60000) return c.data;
  const headers = {"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(S.pat) headers["Authorization"] = "Bearer "+S.pat.trim();
  const res = await fetch(url,{headers});
  const rem = res.headers.get("x-ratelimit-remaining"), lim = res.headers.get("x-ratelimit-limit");
  if(rem!==null){ rateInfo = rem+" / "+lim; const el=document.getElementById("rateShow"); if(el) el.textContent=rateInfo; }
  if(res.status===403 || res.status===429){
    const reset = res.headers.get("x-ratelimit-reset");
    const when = reset ? new Date(reset*1000).toLocaleTimeString() : "しばらく後";
    throw new Error("APIレート制限に達しました。"+when+" 頃に回復します。PATを設定すると5,000回/時に増えます。");
  }
  if(res.status===401) throw new Error("PATが無効です (401)。設定を確認してください。");
  if(res.status===404) throw new Error("見つかりません (404): "+path);
  if(!res.ok) throw new Error("GitHub APIエラー "+res.status);
  const data = await res.json();
  memCache.set(url,{t:Date.now(),data});
  return data;
}

/* ============ markdown ============ */
function md(text){
  if(!text) return "";
  try{
    if(window.marked && window.DOMPurify){
      return DOMPurify.sanitize(marked.parse(text, {breaks:true, mangle:false, headerIds:false}));
    }
  }catch(e){}
  return esc(text).replace(/\n/g,"<br>");
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function ago(iso){
  const s=(Date.now()-new Date(iso))/1000;
  if(s<3600) return Math.floor(s/60)+"分前";
  if(s<86400) return Math.floor(s/3600)+"時間前";
  if(s<86400*30) return Math.floor(s/86400)+"日前";
  return fmtDate(iso);
}

/* ============ gamification ============ */
function totalRead(){ return Object.keys(S.read).length; }
function levelInfo(){
  let li=0;
  for(let i=0;i<LEVELS.length;i++) if(S.xp>=LEVELS[i].xp) li=i;
  const cur=LEVELS[li], next=LEVELS[li+1];
  return {n:li+1, name:cur.name, cur:cur.xp, next:next?next.xp:null};
}
function streak(){
  let n=0; const d=new Date();
  if(!(S.daily[today()]>0)) d.setDate(d.getDate()-1); // 今日まだ0なら昨日から数える
  for(;;){
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(S.daily[k]>0){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function grantBadge(id){
  if(S.badges[id]) return;
  S.badges[id]=new Date().toISOString(); S.xp+=XP_BADGE;
  const b=BADGES.find(x=>x.id===id);
  toast(b.ic+" バッジ獲得!「"+b.nm+"」 +"+XP_BADGE+"XP");
  confetti(14);
}
function checkBadges(){
  const t=totalRead(), st=streak(), td=S.daily[today()]||0;
  if(t>=1) grantBadge("first");
  if(t>=10) grantBadge("total10");
  if(t>=50) grantBadge("total50");
  if(t>=100) grantBadge("total100");
  if(t>=300) grantBadge("total300");
  if(st>=3) grantBadge("streak3");
  if(st>=7) grantBadge("streak7");
  if(st>=30) grantBadge("streak30");
  if(td>=20) grantBadge("burst20");
  const repos=new Set(), sawJa=new Set();
  for(const k in S.read){ const r=S.read[k].repo; repos.add(r);
    const rr=S.repos.find(x=>x.full===r); if(rr) sawJa.add(!!rr.ja); }
  if(repos.size>=3) grantBadge("repos3");
  if(sawJa.has(true)&&sawJa.has(false)) grantBadge("bilingual");
}
function markRead(repo, num, title){
  const key=repo+"#"+num;
  if(S.read[key]) return false;
  const beforeLv=levelInfo().n;
  S.read[key]={d:today(), repo, title:(title||"").slice(0,120)};
  S.daily[today()]=(S.daily[today()]||0)+1;
  S.xp+=XP_READ;
  const td=S.daily[today()];
  if(td===S.goal && !S.goalDays[today()]){
    S.goalDays[today()]=true; S.xp+=XP_GOAL;
    toast("🎉 今日のノルマ "+S.goal+"件 達成! ボーナス +"+XP_GOAL+"XP");
    confetti(28); grantBadge("goal1");
  }
  checkBadges();
  if(levelInfo().n>beforeLv){ toast("⬆️ レベルアップ! Lv."+levelInfo().n+"「"+levelInfo().name+"」"); confetti(20); }
  save(); renderChips();
  return true;
}
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
}
function confetti(n){
  const em=["🎉","✨","⭐","💫","🎊","🌟"];
  for(let i=0;i<n;i++){
    const s=document.createElement("div"); s.className="confetti";
    s.textContent=em[Math.floor(Math.random()*em.length)];
    s.style.left=Math.random()*100+"vw"; s.style.top=(-10-Math.random()*20)+"px";
    s.style.animationDelay=(Math.random()*0.5)+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),2600);
  }
}
function renderChips(){
  const li=levelInfo();
  document.getElementById("chipLevel").textContent="Lv."+li.n+" "+li.name;
  document.getElementById("chipXp").textContent=S.xp;
  document.getElementById("chipStreak").textContent=streak();
  const td=S.daily[today()]||0;
  document.getElementById("todayCnt").textContent=td;
  document.getElementById("goalShow").textContent=S.goal;
  document.getElementById("ringNum").textContent=td;
  const pct=Math.min(1, td/S.goal);
  document.getElementById("ringFg").style.strokeDashoffset=88*(1-pct);
  document.getElementById("ringFg").style.stroke = pct>=1 ? "#e3b341" : "#3fb950";
}

/* ============ views ============ */
let VIEW={name:"list", repo:null, page:1, prs:[], loading:false};
const main=document.getElementById("main");

function renderRepos(){
  const el=document.getElementById("repoList"); el.innerHTML="";
  S.repos.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="repo"+(VIEW.repo===r.full?" active":"");
    d.innerHTML='<span class="name" title="'+esc(r.note||"")+'">'+esc(r.full)+'</span>'
      +(r.ja?'<span class="tag ja">日本語</span>':"")
      +'<span class="tag lang">'+esc(r.langs?.[0]||"")+'</span>'
      +'<span class="tag" style="cursor:pointer" title="削除" data-del="'+i+'">×</span>';
    d.addEventListener("click",e=>{
      if(e.target.dataset.del!==undefined){
        if(confirm(r.full+" をリストから削除しますか?")){ S.repos.splice(i,1); save(); renderRepos(); }
        e.stopPropagation(); return;
      }
      openList(r.full);
    });
    el.appendChild(d);
  });
}

async function openList(repo, page=1, append=false){
  VIEW={name:"list", repo, page, prs: append?VIEW.prs:[] , loading:true};
  renderRepos();
  if(!append) main.innerHTML='<div class="muted"><span class="spin"></span> '+esc(repo)+' のマージ済みPRを取得中...</div>';
  try{
    const list = await gh("/repos/"+repo+"/pulls?state=closed&sort=updated&direction=desc&per_page=30&page="+page);
    const merged = list.filter(p=>p.merged_at);
    VIEW.prs = VIEW.prs.concat(merged);
    VIEW.loading=false;
    renderList();
    const auto = S.autoEnrich===null ? !!S.pat : S.autoEnrich;
    if(auto) enrich(repo, merged);
  }catch(err){
    main.innerHTML='<div class="notice">⚠️ '+esc(err.message)+'</div>';
  }
}
async function enrich(repo, prs){
  for(const p of prs){
    if(VIEW.repo!==repo) return;
    if(p._rc!==undefined) continue;
    try{
      const d = await gh("/repos/"+repo+"/pulls/"+p.number, 360);
      p._rc = d.review_comments; p._cc = d.comments; p._files=d.changed_files; p._add=d.additions; p._del=d.deletions;
      const el=document.getElementById("rc-"+p.number);
      if(el) el.innerHTML=cntHtml(p);
    }catch(e){ return; }
  }
}
function cntHtml(p){
  if(p._rc===undefined) return '<span class="muted">💬 …</span>';
  return '<span class="badge-cnt">💬 レビュー指摘 '+p._rc+'</span> <span class="muted">/ 会話 '+p._cc+' / '+p._files+'ファイル <span style="color:var(--green)">+'+p._add+'</span> <span style="color:var(--red)">-'+p._del+'</span></span>';
}
function renderList(){
  const repo=VIEW.repo;
  const meta=S.repos.find(r=>r.full===repo);
  let h='<div class="backbar"><h2 style="font-size:16px">'+esc(repo)+'</h2>'
    +(meta?.ja?'<span class="tag ja">日本語レビュー</span>':"")
    +'<a class="muted" href="https://github.com/'+repo+'/pulls?q=is%3Apr+is%3Amerged" target="_blank">GitHubで見る ↗</a>'
    +'<span class="muted" style="margin-left:auto">マージ済みPR・更新順。💬が多いPRほど学びが多い</span></div>';
  if(!S.pat) h+='<div class="notice">💡 PAT未設定です(60回/時制限)。左の設定に貼ると5,000回/時になり、レビュー数の自動表示も快適になります。</div>';
  for(const p of VIEW.prs){
    const key=repo+"#"+p.number;
    const read=!!S.read[key];
    h+='<div class="prcard" data-num="'+p.number+'">'
      +'<div class="title">'+(read?'<span class="read-mark">✓ </span>':'')+esc(p.title)+'</div>'
      +'<div class="meta">'
      +'<span class="state-merged">⬗ merged '+ago(p.merged_at)+'</span>'
      +'<span>#'+p.number+' by '+esc(p.user?.login||"?")+'</span>'
      +'<span id="rc-'+p.number+'">'+cntHtml(p)+'</span>'
      +(p.labels||[]).slice(0,4).map(l=>'<span class="lbl" style="border-color:#'+l.color+';color:#'+l.color+'">'+esc(l.name)+'</span>').join("")
      +'</div></div>';
  }
  if(!VIEW.prs.length) h+='<div class="muted">マージ済みPRが見つかりませんでした。</div>';
  h+='<div style="text-align:center;margin:14px"><button class="btn" id="moreBtn">さらに読み込む</button></div>';
  main.innerHTML=h;
  main.querySelectorAll(".prcard").forEach(c=>c.addEventListener("click",()=>openDetail(repo, +c.dataset.num)));
  document.getElementById("moreBtn").addEventListener("click",()=>openList(repo, VIEW.page+1, true));
}

async function openDetail(repo, num){
  VIEW={name:"detail", repo, num};
  main.innerHTML='<div class="muted"><span class="spin"></span> PR #'+num+' のレビューを取得中... (4リクエスト)</div>';
  try{
    const [pr, reviews, rcomments, icomments] = await Promise.all([
      gh("/repos/"+repo+"/pulls/"+num, 360),
      gh("/repos/"+repo+"/pulls/"+num+"/reviews?per_page=100", 360),
      gh("/repos/"+repo+"/pulls/"+num+"/comments?per_page=100", 360),
      gh("/repos/"+repo+"/issues/"+num+"/comments?per_page=100", 360)
    ]);
    renderDetail(repo, pr, reviews, rcomments, icomments);
  }catch(err){
    main.innerHTML='<div class="notice">⚠️ '+esc(err.message)+'</div><button class="btn" onclick="openList(\''+repo+'\')">← 一覧へ戻る</button>';
  }
}
function commentHtml(c, withState){
  const assoc={OWNER:"Owner",MEMBER:"Member",COLLABORATOR:"Collab",CONTRIBUTOR:"Contrib"}[c.author_association]||"";
  return '<div class="comment"><div class="who">'
    +'<img src="'+esc(c.user?.avatar_url||"")+'" alt="">'
    +'<span class="login">'+esc(c.user?.login||"?")+'</span>'
    +(assoc?'<span class="assoc">'+assoc+'</span>':"")
    +(withState&&c.state?'<span class="rv-state rv-'+c.state+'">'+c.state.replace("_"," ")+'</span>':"")
    +'<span class="muted">'+ago(c.submitted_at||c.created_at)+'</span>'
    +'</div><div class="md">'+md(c.body)+'</div></div>';
}
function hunkHtml(h){
  if(!h) return "";
  const lines=h.split("\n");
  const shown=lines.length>18? lines.slice(-18):lines;
  return '<pre class="hunk">'+(lines.length>18?'<span class="ln muted">... ('+(lines.length-18)+'行省略)</span>':'')
    +shown.map(l=>{
      const cls=l.startsWith("+")?"add":l.startsWith("-")?"del":l.startsWith("@@")?"hd":"";
      return '<span class="ln '+cls+'">'+esc(l||" ")+'</span>';
    }).join("")+'</pre>';
}
function renderDetail(repo, pr, reviews, rcomments, icomments){
  const key=repo+"#"+pr.number, read=!!S.read[key];
  // group review comments into threads
  const byId={}, roots=[];
  rcomments.forEach(c=>{ byId[c.id]=c; c._replies=[]; });
  rcomments.forEach(c=>{
    if(c.in_reply_to_id && byId[c.in_reply_to_id]) byId[c.in_reply_to_id]._replies.push(c);
    else roots.push(c);
  });
  // group threads by file
  const files={};
  roots.forEach(r=>{ (files[r.path]??=[]).push(r); });

  let h='<div class="backbar">'
    +'<button class="btn" id="backBtn">← 一覧</button>'
    +'<a class="btn" href="'+esc(pr.html_url)+'" target="_blank">GitHubで開く ↗</a>'
    +'<button class="btn '+(read?'':'green')+'" id="readBtn" '+(read?'disabled':'')+'>'+(read?'✓ 読了済み':'読了にする (+'+XP_READ+' XP)')+'</button>'
    +'</div>'
    +'<div class="dtitle">'+esc(pr.title)+' <span class="muted">#'+pr.number+'</span></div>'
    +'<div class="dmeta">'+esc(repo)+' / by '+esc(pr.user?.login)+' / merged '+fmtDate(pr.merged_at)
    +' / '+pr.changed_files+'ファイル <span style="color:var(--green)">+'+pr.additions+'</span> <span style="color:var(--red)">-'+pr.deletions+'</span>'
    +' / 💬指摘 '+pr.review_comments+' / 会話 '+pr.comments+'</div>';

  if(pr.body) h+='<div class="card"><div class="head">📝 PR説明</div><div class="body md">'+md(pr.body)+'</div></div>';

  const subReviews=reviews.filter(r=>r.body || r.state!=="COMMENTED");
  if(subReviews.length){
    h+='<div class="card"><div class="head">🧑‍⚖️ レビュー判定 ('+subReviews.length+')</div>';
    subReviews.forEach(r=>{ h+=commentHtml(r,true); });
    h+='</div>';
  }

  const fileKeys=Object.keys(files);
  if(fileKeys.length){
    h+='<h3 style="margin:16px 0 10px;font-size:15px">💬 コード指摘スレッド ('+roots.length+')</h3>';
    fileKeys.forEach(path=>{
      files[path].forEach(root=>{
        h+='<div class="card"><div class="head"><span class="filehead">'+esc(path)+'</span></div>'
          +hunkHtml(root.diff_hunk)
          +commentHtml(root)
          +root._replies.map(rr=>commentHtml(rr)).join("")
          +'</div>';
      });
    });
  } else {
    h+='<div class="notice">このPRにはコード行への指摘コメントがありません。会話コメントやレビュー判定を読みましょう。</div>';
  }

  if(icomments.length){
    h+='<div class="card"><div class="head">🗣️ 会話 ('+icomments.length+')</div>';
    icomments.forEach(c=>{ h+=commentHtml(c); });
    h+='</div>';
  }
  h+='<div style="margin:18px 0 40px;text-align:center"><button class="btn '+(read?'':'green')+'" id="readBtn2" '+(read?'disabled':'')+'>'+(read?'✓ 読了済み':'読み終えた! 読了にする (+'+XP_READ+' XP)')+'</button></div>';

  main.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("backBtn").addEventListener("click",()=>openList(repo));
  const doRead=()=>{ if(markRead(repo, pr.number, pr.title)){
    toast("📖 読了! +"+XP_READ+"XP ("+(S.daily[today()]||0)+"/"+S.goal+")");
    ["readBtn","readBtn2"].forEach(id=>{const b=document.getElementById(id); if(b){b.disabled=true;b.textContent="✓ 読了済み";b.classList.remove("green");}});
  }};
  document.getElementById("readBtn").addEventListener("click",doRead);
  document.getElementById("readBtn2").addEventListener("click",doRead);
}

/* ============ progress modal ============ */
function showProgress(){
  const li=levelInfo(), st=streak(), t=totalRead();
  const pct = li.next? Math.round(100*(S.xp-li.cur)/(li.next-li.cur)) : 100;
  const days=[];
  for(let i=13;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    days.push({k, n:S.daily[k]||0, dl:(d.getMonth()+1)+"/"+d.getDate()});
  }
  const mx=Math.max(S.goal, ...days.map(d=>d.n), 1);
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML='<div class="modal">'
    +'<h2>📊 進捗 <span class="muted" style="font-weight:normal">Lv.'+li.n+'「'+li.name+'」</span></h2>'
    +'<div class="xpbar"><div style="width:'+pct+'%"></div></div>'
    +'<div class="muted" style="margin-bottom:14px">'+S.xp+' XP'+(li.next?' / 次のレベルまで '+(li.next-S.xp)+' XP':' (最高レベル!)')+'</div>'
    +'<div class="statgrid">'
    +'<div class="stat"><div class="v">'+(S.daily[today()]||0)+'</div><div class="k">今日 (ノルマ'+S.goal+')</div></div>'
    +'<div class="stat"><div class="v">'+t+'</div><div class="k">累計読了</div></div>'
    +'<div class="stat"><div class="v">'+st+'</div><div class="k">連続日数 🔥</div></div>'
    +'<div class="stat"><div class="v">'+Object.keys(S.badges).length+'/'+BADGES.length+'</div><div class="k">バッジ</div></div>'
    +'</div>'
    +'<h3 style="font-size:13px;margin-bottom:2px">直近14日</h3>'
    +'<div class="week">'+days.map(d=>'<div class="col" title="'+d.k+': '+d.n+'件"><div class="bar'+(d.n>=S.goal?' goal':'')+'" style="height:'+Math.round(52*d.n/mx)+'px"></div><div class="dl">'+d.dl+'</div></div>').join("")+'</div>'
    +'<h3 style="font-size:13px;margin:16px 0 8px">バッジ</h3>'
    +'<div class="badges">'+BADGES.map(b=>'<div class="bdg'+(S.badges[b.id]?'':' locked')+'"><div class="ic">'+b.ic+'</div><div><div class="nm">'+b.nm+'</div><div class="ds">'+b.ds+'</div></div></div>').join("")+'</div>'
    +'<div style="text-align:right;margin-top:16px"><button class="btn" id="closeModal">閉じる</button></div>'
    +'</div>';
  document.body.appendChild(ov);
  ov.addEventListener("click",e=>{ if(e.target===ov) ov.remove(); });
  ov.querySelector("#closeModal").addEventListener("click",()=>ov.remove());
}

/* ============ wire up ============ */
document.getElementById("btnProgress").addEventListener("click",showProgress);
document.getElementById("chipLevel").addEventListener("click",showProgress);
const patInput=document.getElementById("patInput");
patInput.value=S.pat;
patInput.addEventListener("change",()=>{ S.pat=patInput.value.trim(); save(); memCache.clear(); toast(S.pat?"🔑 PATを保存しました":"PATを削除しました"); });
const goalInput=document.getElementById("goalInput");
goalInput.value=S.goal;
goalInput.addEventListener("change",()=>{ S.goal=Math.max(1,Math.min(50,+goalInput.value||15)); goalInput.value=S.goal; save(); renderChips(); });
const autoEnrichEl=document.getElementById("autoEnrich");
autoEnrichEl.checked = S.autoEnrich===null ? !!S.pat : S.autoEnrich;
autoEnrichEl.addEventListener("change",()=>{ S.autoEnrich=autoEnrichEl.checked; save(); });
document.getElementById("addRepoBtn").addEventListener("click",()=>{
  const v=document.getElementById("addRepoInput").value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(v)){ alert("owner/repo の形式で入力してください"); return; }
  if(S.repos.some(r=>r.full===v)){ alert("既に追加されています"); return; }
  S.repos.unshift({full:v, langs:["?"], ja:false, note:"手動追加"});
  document.getElementById("addRepoInput").value="";
  save(); renderRepos(); openList(v);
});
window.openList=openList;

renderChips();
renderRepos();
main.innerHTML='<div style="max-width:640px;margin:40px auto;text-align:center">'
  +'<div style="font-size:44px">🏋️</div>'
  +'<h2 style="margin:10px 0">Review Gym へようこそ</h2>'
  +'<p class="muted" style="margin-bottom:16px">「他人が受けたレビューを全て読む」を実践するアプリです。<br>左のリポジトリを選ぶと、マージ済みPRとそのレビュー指摘が読めます。<br>1件読み終えるごとに「読了」を押してXPを貯めましょう。<br><span style="color:var(--orange)">オレンジの「日本語」タグ</span>は日本語レビューが活発なリポジトリです。</p>'
  +'<p class="muted">今日のノルマ: <b style="color:var(--yellow)">'+S.goal+'件</b> / まずはPAT設定がおすすめです</p>'
  +'</div>';
</script>
