# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build todo-app
        run: |
          if [ -f "todo-app/package.json" ]; then
            cd todo-app
            npm ci
            npm run build
            # distの中身をtodo-appディレクトリに移動
            cp -r dist/* .
            rm -rf dist
            # ソースファイルを削除
            rm -rf src node_modules package.json package-lock.json tsconfig.json vite.config.ts postcss.config.js tailwind.config.js
          fi
        shell: bash
      
      - name: Build barcode-scan
        run: |
          if [ -f "barcode-scan/package.json" ]; then
            cd barcode-scan
            npm ci
            npm run build
            # distの中身をbarcode-scanディレクトリに移動
            cp -r dist/* .
            rm -rf dist
            # ソースファイルを削除
            rm -rf src node_modules package.json package-lock.json vite.config.js
          fi
        shell: bash

      - name: Build monolog
        run: |
          if [ -f "monolog/package.json" ]; then
            cd monolog
            npm ci
            npm run build
            # distの中身をmonologディレクトリに移動
            cp -r dist/* .
            rm -rf dist
            # ソースファイルを削除
            rm -rf src node_modules package.json package-lock.json tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts postcss.config.js tailwind.config.js
          fi
        shell: bash

      - name: Build telop
        run: |
          if [ -f "telop/package.json" ]; then
            cd telop
            npm ci
            npm run build
            # distの中身をtelopディレクトリに移動
            cp -r dist/* .
            rm -rf dist
            # ソースファイルを削除
            rm -rf src node_modules package.json package-lock.json tsconfig.json vite.config.js .gitignore
          fi
        shell: bash
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
