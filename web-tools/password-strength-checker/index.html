<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード強度チェッカー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #4a90e2;
        }

        .strength-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 0.75rem;
            overflow: hidden;
        }

        .strength-bar-fill {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
            border-radius: 2px;
        }

        .strength-bar-fill.score-0 { width: 0%; background: #e0e0e0; }
        .strength-bar-fill.score-1 { width: 25%; background: #e74c3c; }
        .strength-bar-fill.score-2 { width: 50%; background: #e67e22; }
        .strength-bar-fill.score-3 { width: 75%; background: #f39c12; }
        .strength-bar-fill.score-4 { width: 100%; background: #27ae60; }

        .strength-text {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #666;
        }

        .info {
            margin-top: 1rem;
            font-size: 0.813rem;
            color: #999;
        }

        .toggle-visibility {
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .toggle-visibility label {
            cursor: pointer;
            user-select: none;
            color: #4a90e2;
        }

        .toggle-visibility input {
            margin-right: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>パスワード強度チェック</h1>
        
        <input type="password" id="password" placeholder="パスワードを入力">
        
        <div class="strength-bar">
            <div class="strength-bar-fill" id="strengthBar"></div>
        </div>
        
        <div class="strength-text" id="strengthText"></div>
        
        <div class="toggle-visibility">
            <label>
                <input type="checkbox" id="showPassword">
                パスワードを表示
            </label>
        </div>
        
        <div class="info" id="feedback"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/zxcvbn@4.4.2/dist/zxcvbn.js"></script>
    <script>
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const feedback = document.getElementById('feedback');
        const showPasswordCheckbox = document.getElementById('showPassword');

        const strengthLabels = ['', '弱い', 'やや弱い', '普通', '強い'];

        passwordInput.addEventListener('input', function() {
            const password = this.value;
            
            if (!password) {
                strengthBar.className = 'strength-bar-fill';
                strengthText.textContent = '';
                feedback.textContent = '';
                return;
            }

            const result = zxcvbn(password);
            const score = result.score;

            // スコアに応じてバーを更新
            strengthBar.className = `strength-bar-fill score-${score}`;
            strengthText.textContent = `強度: ${strengthLabels[score]}`;

            // フィードバックを表示
            let feedbackText = '';
            if (result.feedback.warning) {
                feedbackText += result.feedback.warning + ' ';
            }
            if (result.feedback.suggestions.length > 0) {
                feedbackText += result.feedback.suggestions.join(' ');
            }
            
            // クラック時間の目安を追加
            const crackTime = result.crack_times_display.offline_slow_hashing_1e4_per_second;
            if (crackTime) {
                feedbackText += feedbackText ? ` (クラックまで: ${crackTime})` : `クラックまで: ${crackTime}`;
            }

            feedback.textContent = feedbackText;
        });

        // パスワード表示/非表示の切り替え
        showPasswordCheckbox.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });
    </script>
</body>
</html>
