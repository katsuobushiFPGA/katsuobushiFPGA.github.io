<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ナイトレイン ボス不明判定ツール</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>ナイトレイン ボス不明判定ツール</h1>
            <p>1日目のボスやイベントの発生状況から、3日目のボス（最終ボス）を予測します。</p>
        </header>

        <main>
            <div class="input-group">
                <label for="day1-boss">1日目の夜ボス</label>
                <select id="day1-boss">
                    <option value="">選択してください</option>
                    <optgroup label="通常ボス">
                        <option value="ajin">亜人の女王と亜人の剣聖</option>
                        <option value="bell">鈴玉狩り</option>
                        <option value="freidia">公のフレイディア</option>
                        <option value="dragon">貧食ドラゴン</option>
                        <option value="cavalry">夜の騎兵</option>
                        <option value="gargoyle">英雄のガーゴイル</option>
                        <option value="worm">ミミズ顔</option>
                        <option value="centipede">百足のデーモン</option>
                        <option value="demon">溶鉄デーモン</option>
                        <option value="commander">戦場の宿将</option>
                        <option value="spirit">爛れた樹霊</option>
                        <option value="tibia">ティビアの呼び舟</option>
                        <option value="grafted">接ぎ木の君主</option>
                        <option value="revenant">王族の幽鬼</option>
                    </optgroup>
                    <optgroup label="DLCボス (安寧者ルート)">
                        <option value="curseblade_beast">呪剣士＆神獣戦士</option>
                        <option value="wounded_demon">傷ついた＆うろ底のデーモン</option>
                    </optgroup>
                    <optgroup label="DLCボス (瓦礫の王ルート)">
                        <option value="death_knight">死の騎士</option>
                        <option value="red_bear">大赤熊</option>
                    </optgroup>
                </select>
            </div>

            <div class="input-group">
                <label for="day2-boss">2日目の夜ボス</label>
                <select id="day2-boss">
                    <option value="">選択してください（不明/未到達）</option>
                    <optgroup label="通常ボス">
                        <option value="omen">忌み鬼</option>
                        <option value="tree_sentinel">ツリーガード</option>
                        <option value="crucible_hippo">坩堝＆黄金カバ</option>
                        <option value="death_rite_bird">死儀礼の鳥</option>
                        <option value="godskin_duo">神肌のふたり</option>
                        <option value="remote_commander">僻地の宿将</option>
                        <option value="dragonkin">竜人兵</option>
                        <option value="nameless_king">無名の王</option>
                        <option value="fallingstar">降る星の成獣</option>
                        <option value="draconic_tree_sentinel">竜のツリーガード</option>
                        <option value="dancer">冷たい谷の踊り子</option>
                        <option value="ancient_dragon">古竜</option>
                        <option value="magma_wyrm">大土竜</option>
                    </optgroup>
                    <optgroup label="DLCボス (安寧者ルート)">
                        <option value="mohgu">血の君主モーグ</option>
                        <option value="demon_prince">デーモンの王子</option>
                    </optgroup>
                    <optgroup label="DLCボス (瓦礫の王ルート)">
                        <option value="dancing_lion">神獣獅子舞</option>
                        <option value="artorias">深淵歩きアルトリウス</option>
                    </optgroup>
                </select>
            </div>

            <div class="input-group checkbox-group">
                <label>
                    <input type="checkbox" id="sudden-check">
                    突発イベントが発生した
                </label>
                <div id="sudden-selector-container" class="hidden" style="margin-top: 0.5rem; margin-left: 1.5rem;">
                    <label for="sudden-event-name" style="font-size: 0.9em;">突発イベントの種類を選択:</label>
                    <select id="sudden-event-name">
                        <option value="">選択してください</option>
                        <option value="mausoleum">歩く霊廟</option>
                        <option value="meteorite">隕石</option>
                        <option value="frenzied_flame">狂い火</option>
                        <option value="ancient_tower">古の魔術師塔</option>
                        <option value="night_faction">夜の勢力</option>
                        <option value="new_threat">大いなる脅威</option>
                    </select>
                    <p class="note">※突発イベントが起こった場合はナメレスではない</p>
                </div>
            </div>

            <div class="input-group checkbox-group">
                <label>
                    <input type="checkbox" id="raid-check">
                    襲撃イベントが発生した
                </label>
                
                <div id="raid-selector-container" class="hidden" style="margin-top: 0.5rem; margin-left: 1.5rem;">
                    <label for="raid-boss" style="font-size: 0.9em;">襲撃イベントの種類を選択:</label>
                    <select id="raid-boss">
                        <option value="">選択してください</option>
                        <option value="raid_omen">忌み鬼</option>
                        <option value="intelligent_slug">知性の蟲</option>
                        <option value="kizashi">兆し</option>
                        <option value="tamer_monster">調律の魔物</option>
                    </select>
                </div>
            </div>

            <div id="result-area" class="result-area hidden">
                <h2>予想される3日目ボス候補</h2>
                <div id="result-list" class="result-list">
                    <!-- 結果がここに表示されます -->
                </div>
            </div>
        </main>
        
        <footer>
            <a href="../../index.html">← Topに戻る</a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
